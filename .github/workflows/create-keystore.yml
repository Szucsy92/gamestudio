name: Aláírókulcs készítése

# Egyszer kell lefuttatni, az új natív app első kiadása előtt.
# Az eredmény egy artifact (csak a tároló tagjai látják, 1 napig él): a benne lévő két értéket be kell másolni
# Settings → Secrets and variables → Actions → New repository secret:
#   ANDROID_KEYSTORE_BASE64   (keystore.base64 tartalma)
#   ANDROID_KEYSTORE_PASSWORD (a jelszó)
# Utána az artifactot töröld. A kulcsot ne veszítsd el: ugyanezzel kell aláírni minden későbbi kiadást, különben az OTA-frissítés nem települ.
on:
  workflow_dispatch:
    inputs:
      alias:
        description: "A kulcs aliasa (ha más, a Variables között ANDROID_KEY_ALIAS-ként is add meg)"
        default: gamestudio
        required: true

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Kulcs előállítása
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          mkdir -p out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore out/game-studio.keystore -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=GameStudio, O=GameStudio"
          base64 -w0 out/game-studio.keystore > out/keystore.base64
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\nalias=%s\n' "$PASS" "$ALIAS" > out/secrets.txt
          rm out/game-studio.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/*
          retention-days: 1
