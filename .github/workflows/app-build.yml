name: GameStudio – natív APK építése

# Indítás: GitHub → Actions → "GameStudio – natív APK építése" → Run workflow
# Az APK-t a Releases oldalon találod; az app ebből a kiadásból frissíti magát (OTA, felugró ablakkal).
on:
  workflow_dispatch:

# Alapból csak olvasás; írási jog csak a kiadást készítő lépésnek van.
permissions:
  contents: read

jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
      version: ${{ steps.s.outputs.version }}
      code: ${{ steps.s.outputs.code }}
      title: ${{ steps.s.outputs.title }}
    steps:
      - id: s
        run: |
          # Dátumjelző (budapesti idő): fájlnevekben, verzióban, kiadáscímkében.
          # A versionCode = futás sorszáma + eltolás. Az eltolás (Settings → Variables → VERSION_CODE_OFFSET) csak akkor kell,
          # ha az app egy korábbi, magasabb versionCode-ú telepítés fölé kerül: Android nem enged alacsonyabbra frissíteni.
          CODE=$(( ${{ github.run_number }} + ${{ vars.VERSION_CODE_OFFSET || 0 }} ))
          echo "stamp=$(TZ=Europe/Budapest date +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Europe/Budapest date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "title=GameStudio $(TZ=Europe/Budapest date '+%Y.%m.%d. %H:%M') (#$CODE)" >> "$GITHUB_OUTPUT"

  # A natív egységtesztek hibája blokkolja a kiadást.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

  android:
    needs: [stamp, tests]
    runs-on: ubuntu-latest
    env:
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
      APP_VERSION_NAME: ${{ needs.stamp.outputs.version }}
      APP_VERSION_CODE: ${{ needs.stamp.outputs.code }}
      KS_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'gamestudio' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: APK fordítása és aláírása
        working-directory: android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ../out
          # Ideiglenes (teszt) aláírású APK-t soha nem adunk ki: másik kulccsal aláírt APK nem települ a meglévő app fölé.
          if [ -z "$KS_PASSWORD" ] || [ -z "$KS_BASE64" ]; then
            echo "::error::Hiányzik az ANDROID_KEYSTORE_PASSWORD / ANDROID_KEYSTORE_BASE64 titok – APK nem készül. Kulcs készítése: Actions → \"Aláírókulcs készítése\"."
            exit 1
          fi
          KS_FILE="$RUNNER_TEMP/game-studio.keystore"
          printf '%s' "$KS_BASE64" | base64 -d > "$KS_FILE"
          export KS_FILE KS_PASSWORD
          echo "KS_FILE=$KS_FILE" >> "$GITHUB_ENV"
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../out/game-studio-${BUILD_STAMP}.apk"

      # Az APK-t az állandó kulccsal kell aláírni, különben az appon belüli (OTA) frissítés nem települ fel.
      - name: Aláírás ellenőrzése (az állandó kulccsal egyezik-e)
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose out/*.apk
          "$APKSIGNER" verify --print-certs out/*.apk > "$RUNNER_TEMP/apk-certs.txt"
          ACTUAL=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certs.txt" | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(keytool -exportcert -keystore "$KS_FILE" -storepass:env KS_PASSWORD -alias "$KS_ALIAS" | sha256sum | cut -d ' ' -f 1)
          echo "APK tanúsítvány SHA-256: $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Aláírókulcs törlése a futtatóról
        if: always()
        run: rm -f "$RUNNER_TEMP/game-studio.keystore"

      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: out/*, if-no-files-found: error }

  release:
    needs: [stamp, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Verzióadatok
        run: |
          printf '{"versionCode":%s,"version":"%s"}\n' '${{ needs.stamp.outputs.code }}' '${{ needs.stamp.outputs.version }}' > out/game-studio-release.json
      - name: Kiadás (Releases)
        uses: softprops/action-gh-release@v2
        with:
          # A címke a versionCode-dal végződik (build-2026-11-27_1530-42): az OTA-frissítő ebből ismeri fel az újabb verziót.
          tag_name: build-${{ needs.stamp.outputs.stamp }}-${{ needs.stamp.outputs.code }}
          name: ${{ needs.stamp.outputs.title }}
          body: |
            Verzió: ${{ needs.stamp.outputs.version }} (#${{ needs.stamp.outputs.code }})

            Az appon belül ("Frissítés") vagy az .apk letöltésével telepíthető (ismeretlen forrás engedélyezése kell).
          files: out/*
